<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fold</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EDEFEA; --surface: #FFFFFF; --raised: #F4F6F1;
    --ink: #232922; --soft: #677064; --line: #D9DDD3;
    --accent: #3E6F4F; --accent-contrast: #FFFFFF;
    --working: #47708C; --working-bg: #E3ECF2;
    --attn: #A87B2A;    --attn-bg: #F5EBD6;
    --frozen: #736C8C;  --frozen-bg: #EAE8F1;
    --failed: #A5442A;  --failed-bg: #F4E2DB;
    --done: #3E6F4F;    --done-bg: #DFEAE2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1E19; --surface: #232823; --raised: #2A302A;
      --ink: #E2E6DE; --soft: #98A093; --line: #38403A;
      --accent: #82B292; --accent-contrast: #14261B;
      --working: #86AECB; --working-bg: #23313C;
      --attn: #D9AE5F;    --attn-bg: #3B3221;
      --frozen: #A79FC4;  --frozen-bg: #2E2B3C;
      --failed: #D07B5E;  --failed-bg: #3D2620;
      --done: #8FBE9F;    --done-bg: #24352A;
    }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"IBM Plex Sans",sans-serif; font-size:.85rem; }
  /* hidden must beat any display rule (.board's grid was ignoring it) */
  [hidden] { display:none !important; }
  .topbar { display:flex; align-items:center; gap:1rem; background:var(--surface);
            border-bottom:1px solid var(--line); padding:.65rem 1rem; }
  .wordmark { font-family:"Bricolage Grotesque",sans-serif; font-weight:650; font-size:1.1rem; }
  .wordmark::after { content:"·"; color:var(--accent); margin-left:.15em; }
  .stats { display:flex; gap:.5rem; flex:1; flex-wrap:wrap; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.04em;
          padding:.14em .5em; border-radius:999px; white-space:nowrap; }
  .chip.working { background:var(--working-bg); color:var(--working); }
  .chip.attn { background:var(--attn-bg); color:var(--attn); border:1px dashed var(--attn); }
  .chip.frozen { background:var(--frozen-bg); color:var(--frozen); }
  .chip.failed { background:var(--failed-bg); color:var(--failed); }
  .chip.done { background:var(--done-bg); color:var(--done); }
  .chip.neutral { background:var(--raised); color:var(--soft); border:1px solid var(--line); }
  button { font:inherit; font-weight:600; border:none; border-radius:6px;
           padding:.42em .9em; cursor:pointer; background:var(--accent); color:var(--accent-contrast); }
  button.quiet { background:var(--raised); color:var(--ink); border:1px solid var(--line); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { padding:1rem; }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:.8rem; }
  .col h3 { font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.1em;
            text-transform:uppercase; color:var(--soft); font-weight:500; margin:.2rem 0 .6rem; }
  .col.attn h3 { color:var(--attn); }
  /* each view owns its whole tab: columns get the full viewport height,
     scrolling internally */
  .cards { display:flex; flex-direction:column; gap:.6rem;
           max-height:calc(100vh - 11rem); overflow-y:auto;
           scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .cards::-webkit-scrollbar, .term::-webkit-scrollbar { width:8px; }
  .cards::-webkit-scrollbar-thumb, .term::-webkit-scrollbar-thumb {
    background:var(--line); border-radius:4px; }
  .cards::-webkit-scrollbar-track, .term::-webkit-scrollbar-track {
    background:transparent; }
  .term { scrollbar-width:thin; scrollbar-color:#333A31 transparent; }
  .archbtn { font-size:.68rem; padding:.3em .6em; align-self:flex-start; }
  .tabs { display:flex; gap:1.1rem; padding:.55rem 1rem 0; background:var(--surface);
          border-bottom:1px solid var(--line); }
  .tab { background:none; border:none; font:inherit; font-weight:600; cursor:pointer;
         color:var(--soft); padding:.15rem .1rem .45rem; border-bottom:2px solid transparent; }
  .tab.active { color:var(--ink); border-bottom-color:var(--accent); }
  .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px;
          padding:.6rem .7rem; display:flex; flex-direction:column; gap:.4rem; }
  .card.hand { border-color:var(--attn); box-shadow:0 0 0 1px var(--attn); }
  .card.clickable { cursor:pointer; }
  .card.clickable:hover { border-color:var(--accent); }
  .card.bellwether { border-left:4px solid var(--attn); background:
    linear-gradient(to right, color-mix(in srgb, var(--attn) 7%, var(--surface)), var(--surface) 40%); }
  .card.shepherd { border-left:4px solid var(--accent); background:
    linear-gradient(to right, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 40%); }
  .chip.shepherd { background:var(--done-bg); color:var(--done); border:1px solid var(--done); }
  .card .t { font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
  .card .m { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
  .card .a { display:flex; gap:.4rem; }
  .card .a button { font-size:.68rem; padding:.28em .6em; }
  h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:1rem; margin:1.6rem 0 .6rem; }
  table { border-collapse:collapse; width:100%; background:var(--surface);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th { font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.08em;
       text-transform:uppercase; color:var(--soft); font-weight:500; text-align:left;
       padding:.5rem .7rem; border-bottom:1px solid var(--line); }
  td { padding:.45rem .7rem; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  .mono { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--surface);
           color:var(--ink); padding:1rem; width:min(460px,90vw); }
  dialog::backdrop { background:rgba(20,25,18,.45); }
  dialog h4 { margin:.1rem 0 .8rem; font-family:"Bricolage Grotesque",sans-serif; }
  dialog select, dialog textarea, dialog input:not([type=checkbox]) {
    width:100%; font:inherit; font-size:.8rem;
    background:var(--raised); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:.45em .6em; box-sizing:border-box; margin-bottom:.6rem; }
  dialog textarea { min-height:90px; resize:vertical; }
  .drow { display:flex; justify-content:flex-end; gap:.5rem; }
  .term { background:#10140F; color:#C9D4C4; font-family:"IBM Plex Mono",monospace;
          font-size:.74rem; line-height:1.5; border-radius:8px; padding:.8rem .9rem;
          flex:1; min-height:300px; overflow-y:auto; white-space:pre-wrap; overflow-wrap:anywhere; }
  /* live screen is a fixed terminal grid: never wrap its columns */
  .term.screen { white-space:pre; overflow-wrap:normal; overflow-x:auto; cursor:text; }
  .term.screen:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  .vtab.active { color:var(--ink); border-color:var(--accent); }
  /* conversation markdown (DOM-built; .term's pre-wrap keeps newlines) */
  .term p { margin:.45em 0; }
  .term ul, .term ol { margin:.45em 0; padding-left:1.5em; white-space:normal; }
  .term li { margin:.2em 0; }
  .term pre { background:#0A0D09; border:1px solid #232A20; border-radius:6px;
              padding:.5em .7em; overflow-x:auto; margin:.5em 0; }
  .term code { background:#0A0D09; border-radius:4px; padding:.05em .3em; }
  .term .mdh { font-weight:700; margin:.8em 0 .3em; color:#E4EDE0; }
  .term .mdrole { color:#7E8B78; margin:1.1em 0 .4em; }
  /* no display on the base rule: it would override the UA's display:none
     for closed dialogs (symptom: modal lingers after close until reflow) */
  #taskdlg { width:min(1100px,96vw); height:min(88vh,950px);
             flex-direction:column; }
  #taskdlg[open] { display:flex; }
  .msgrow { display:flex; gap:.5rem; margin-top:.6rem; align-items:flex-start; }
  .msgrow textarea { flex:1; width:auto; font:inherit; font-size:.8rem;
    background:var(--raised); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:.45em .6em; margin-bottom:0;
    min-height:2.6em; max-height:45vh; overflow-y:auto; resize:vertical; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--ink); color:var(--bg); padding:.5em 1em; border-radius:8px;
           font-size:.78rem; opacity:0; transition:opacity .2s; max-width:80vw; }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">fold</span>
    <div class="stats" id="stats"></div>
    <button class="quiet" id="projBtn">Projects</button>
    <button id="dispatchBtn">Dispatch task</button>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="board" id="boardTab">Board</button>
    <button class="tab" data-view="archive" id="archTab">Archive</button>
    <button class="tab" data-view="fleet">Fleet</button>
  </nav>
  <main>
    <div class="board" id="board"></div>
    <div id="archive" hidden>
      <table id="archTable"></table>
    </div>
    <div id="fleetView" hidden>
      <table id="fleet"></table>
    </div>
  </main>

  <dialog id="dlg">
    <h4>Dispatch task</h4>
    <select id="tpl">
      <option value="agent">agent (fold-native, golden image)</option>
      <option value="shepherd">shepherd (fold-native planning session)</option>
    </select>
    <select id="repoSel" aria-label="Project repo"></select>
    <div style="display:flex; gap:.5rem;">
      <select id="llmSel" style="flex:1;" aria-label="Inference endpoint"></select>
      <select id="modelSel" style="flex:2;" aria-label="Model"></select>
    </div>
    <textarea id="prompt" placeholder="Task for the agent — AGENTS.md carries the workflow; write only the work itself."></textarea>
    <label style="font-size:.78rem; display:block; margin-bottom:.6rem;"><input type="checkbox" id="discussFirst"> discuss first — the agent explores and talks it through with you (via Visit) before any implementation</label>
    <div class="drow">
      <button class="quiet" id="cancel">Cancel</button>
      <button id="go">Dispatch</button>
    </div>
  </dialog>
  <dialog id="projdlg">
    <h4>Projects</h4>
    <table id="projList" style="width:100%; font-size:.78rem; border-collapse:collapse; margin-bottom:.9rem;"></table>
    <h4>Register a repo</h4>
    <input id="projPath" placeholder="owner/name on the forge">
    <div style="display:flex; gap:.5rem;">
      <input id="projName" placeholder="project name (default: repo name)" style="flex:1;">
      <select id="projReview" style="flex:1;">
        <option value="bellwether">review: bellwether</option>
        <option value="human">review: human (merge-means-deploy)</option>
      </select>
    </div>
    <label style="font-size:.78rem; display:block; margin-bottom:.3rem;"><input type="checkbox" id="projCreate"> create the repo on the forge (lands under the forge token's own account; else it must exist)</label>
    <label style="font-size:.78rem; display:block; margin-bottom:.6rem;"><input type="checkbox" id="projDefault"> make it the dispatch default</label>
    <div class="drow">
      <button class="quiet" id="projClose">Close</button>
      <button id="projAdd">Register</button>
    </div>
  </dialog>
  <dialog id="taskdlg">
    <h4 id="tdTitle" style="margin-bottom:.35rem;">task</h4>
    <div class="m" id="tdChips" style="display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.5rem;"></div>
    <div style="display:flex; gap:.4rem; margin-bottom:.5rem;">
      <button class="quiet vtab active" id="tdChat">Conversation</button>
      <button class="quiet vtab" id="tdScreen">Screen</button>
      <span class="m" id="tdKeyHint" style="align-self:center;" hidden></span>
    </div>
    <div class="term" id="tdTerm">connecting…</div>
    <div class="msgrow">
      <textarea id="tdMsg" rows="4" placeholder="Message the agent…"></textarea>
      <button id="tdSend" type="button">Send</button>
    </div>
    <div class="drow" style="margin-top:.6rem;">
      <span class="m" id="tdMsgHint" style="margin-right:auto; align-self:center;">Enter sends · Shift+Enter for a newline</span>
      <button class="quiet" id="tdPause" type="button">Pause</button>
      <button class="quiet" id="tdStop" type="button">Stop</button>
      <button class="quiet" id="tdClose" type="button">Close</button>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const COLS = [
  ["Queued", (t) => ["pending","starting"].includes(t.ws_status)],
  ["Working", (t) => t.ws_status==="running" && !t.frozen && t.task_state==="working"],
  ["Needs you", (t) => t.ws_status==="failed" ||
                       ["start_error","start_timeout"].includes(t.agent||"")],
  ["Idle", (t) => t.ws_status==="running" && (t.frozen || t.task_state!=="working")],
  ["Stopped", (t) => ["stopped","stopping"].includes(t.ws_status)],
];
function chip(cls, text) { return `<span class="chip ${cls}">${text}</span>`; }
function fmtTok(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n); }
function tokChips(t) {
  if (!t.tok) return "";
  // input = context weight (grows as the task grinds); output = generation.
  let s = " " + chip("neutral", `in ${fmtTok(t.tok.input)} · out ${fmtTok(t.tok.output)}`);
  // live context size (single-turn input), not the billing sum: peak
  // answers "how big did this task's mind get"
  if (t.tok.peak_ctx) s += " " + chip("neutral", `ctx ${fmtTok(t.tok.peak_ctx)}`);
  if (t.tok.cache_read) s += " " + chip("neutral", `cached ${fmtTok(t.tok.cache_read)}`);
  // intensity: output rate, time-averaged between harvests. The endpoint
  // does ~6k tok/min flat out single-stream, so sustained thousands here
  // means "generating almost continuously" — the runaway signature.
  if (t.tok.out_per_min > 0 && t.ws_status === "running")
    s += " " + chip(t.tok.out_per_min > 2000 ? "attn" : "neutral", `${fmtTok(t.tok.out_per_min)}/min out`);
  return s;
}
function stChip(t) {
  if (t.frozen) return chip("frozen","frozen");
  if (t.ws_status==="failed") return chip("failed","failed");
  if (t.ws_status==="running" && t.task_state==="working") return chip("working","working");
  if (t.ws_status==="running") return chip("done","idle");
  return chip("neutral", t.ws_status);
}
// Form drafts persist across reloads, deploys, and auth expiry: a
// carefully written prompt must never die with its tab's session.
const FORM_KEY = "fold.form.v1";
let savedForm = {};
try { savedForm = JSON.parse(localStorage.getItem(FORM_KEY)) || {}; } catch (e) {}
function saveForm() {
  // dynamic selects may be unpopulated yet: never clobber a saved
  // choice with the empty string
  localStorage.setItem(FORM_KEY, JSON.stringify({
    prompt: $("#prompt").value, tpl: $("#tpl").value,
    repo: $("#repoSel").value || savedForm.repo,
    llm: $("#llmSel").value || savedForm.llm,
    model: $("#modelSel").value || savedForm.model,
    projPath: $("#projPath").value, projName: $("#projName").value,
  }));
  try { savedForm = JSON.parse(localStorage.getItem(FORM_KEY)) || {}; } catch (e) {}
}
function clearDraft(fields) {
  for (const f of fields) delete savedForm[f];
  localStorage.setItem(FORM_KEY, JSON.stringify(savedForm));
}
async function api(path, opts) {
  // fetch that refuses to fail silently: an expired front-door session
  // turns POSTs into auth redirects that die quietly (CORS/non-JSON) —
  // the one failure a user must be TOLD about, not left with a stale
  // "dispatching…" toast
  let r;
  try {
    r = await fetch(path, opts);
  } catch (e) {
    toast("request failed — login likely expired; reload the page (your drafts are saved)");
    throw e;
  }
  const ct = r.headers.get("content-type") || "";
  if (!ct.includes("json")) {
    toast("unexpected reply — login likely expired; reload the page (your drafts are saved)");
    throw new Error("non-json response");
  }
  return r.json();
}
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3500);
}
async function act(verb, ws) {
  toast(`${verb} ${ws}…`);
  const r = await api("/api/action", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({verb, workspace: ws})});
  toast(r.out || (r.ok ? "done" : "failed")); refresh();
}
function bellwetherCard(b) {
  const a = b.active;
  const mins = Math.max(0, Math.round((Date.now()/1000 - (a.started || 0)) / 60));
  const open = `openTask('bellwether-pr${a.pr}','bellwether · PR #${a.pr}','review')`;
  return `<div class="card clickable bellwether" onclick="if(!event.target.closest('button'))${open}">
    <div class="t">bellwether — reviewing PR #${a.pr}</div>
    <div class="m">${chip("attn", a.stage)} ${chip("neutral", a.repo)} ${chip("neutral", mins + "m")}</div>
    <div class="a"><button class="quiet" onclick="${open}">Visit</button></div></div>`;
}
function cardOpen(e, ws, name, st) {
  // the whole card surface opens Visit — but never steal button clicks
  if (e.target.closest("button")) return;
  openTask(ws, name, st);
}
function taskCard(t, colName) {
  const acts = [`<button class="quiet" onclick="openTask('${t.workspace}','${t.name}','${t.frozen ? "frozen" : t.ws_status}')">Visit</button>`];
  if (t.frozen) acts.push(`<button class="quiet" onclick="act('resume','${t.workspace}')">Resume</button>`);
  else if (t.ws_status==="running") acts.push(`<button class="quiet" onclick="act('pause','${t.workspace}')">Pause</button>`,
                                              `<button class="quiet" onclick="act('stop','${t.workspace}')">Stop</button>`);
  else if (["stopped"].includes(t.ws_status)) acts.push(`<button class="quiet" onclick="act('start','${t.workspace}')">Start</button>`);
  const hand = colName==="Needs you";
  const shep = (t.template||"").includes("shepherd");
  return `<div class="card clickable${hand?" hand":""}${shep?" shepherd":""}" onclick="cardOpen(event,'${t.workspace}','${t.name}','${t.frozen ? "frozen" : t.ws_status}')">
    <div class="t">${t.prompt || t.name}</div>
    <div class="m">${shep ? chip("shepherd","shepherd") + " " : ""}${stChip(t)} ${chip("neutral", t.name)}${t.project ? " " + chip("neutral", "⌂ " + t.project) : ""}${t.model ? " " + chip("neutral", t.model.length > 18 ? t.model.slice(0,16)+"…" : t.model) : ""}${t.ctx ? " " + chip("neutral", "ctx " + t.ctx) : ""}${tokChips(t)}</div>
    <div class="a">${acts.join("")}</div></div>`;
}

let visiting = null, visitTimer = null, lastState = null;
function tdChips() {
  // same live chips as the card, mirrored in the Visit header
  const t = ((lastState || {}).tasks || []).find(x => x.workspace === visiting);
  $("#tdChips").innerHTML = t
    ? `${(t.template||"").includes("shepherd") ? chip("shepherd","shepherd")+" " : ""}${stChip(t)} ${t.project ? chip("neutral","⌂ "+t.project) : ""} ${t.model ? chip("neutral", t.model.length>18 ? t.model.slice(0,16)+"…" : t.model) : ""} ${t.ctx ? chip("neutral","ctx "+t.ctx) : ""}${tokChips(t)}`
    : "";
}
const VIEWS = {board: "#board", archive: "#archive", fleet: "#fleetView"};
function setView(v) {
  for (const [name, sel] of Object.entries(VIEWS)) $(sel).hidden = name !== v;
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.view === v));
}
document.querySelectorAll(".tab").forEach(t =>
  t.onclick = () => setView(t.dataset.view));
let visitMode = "chat", screenSrc = null;
function setVisitMode(mode) {
  // Conversation = the full record (opencode.db via the board); Screen =
  // the live terminal grid streamed from agentapi, for watching it work.
  visitMode = mode;
  $("#tdChat").classList.toggle("active", mode === "chat");
  $("#tdScreen").classList.toggle("active", mode === "screen");
  $("#tdTerm").classList.toggle("screen", mode === "screen");
  if (screenSrc) { screenSrc.close(); screenSrc = null; }
  // Screen mode IS the input surface — the chat box would be a second,
  // confusing way to talk; it belongs to the Conversation view.
  $(".msgrow").hidden = visitingIsBW || mode === "screen";
  $("#tdMsgHint").hidden = $(".msgrow").hidden;
  if (mode === "screen" && visiting) {
    $("#tdTerm").textContent = "connecting to live screen…";
    $("#tdTerm").tabIndex = 0;
    $("#tdKeyHint").textContent = KEYHINT_IDLE;
    $("#tdKeyHint").hidden = false;
    screenSrc = new EventSource(`/api/task/${visiting}/screen`);
    screenSrc.addEventListener("screen", (e) => {
      try { $("#tdTerm").textContent = JSON.parse(e.data).screen; }
      catch {}
    });
    // idle streams time out server-side; EventSource reconnects itself
    $("#tdTerm").focus();   // typeable the moment the screen appears
  } else {
    $("#tdTerm").removeAttribute("tabindex");
    $("#tdKeyHint").hidden = true;
    $("#tdTerm").textContent = "connecting…";
    lastChat = null;  // the cache must not outlive what is on screen
    pollVisit();
  }
}
// Typing into the Screen view: keystrokes forward to the session's real
// terminal via agentapi raw input — harness commands, the odd permission
// prompt. A serial queue preserves key order; chunked for the server cap.
const KEYHINT_IDLE = "click the screen to type into the session";
const KEYHINT_LIVE = "keys go to the agent's terminal (Esc too) — click elsewhere to release";
const KEYMAP = {Enter:"\r", Tab:"\t", Backspace:"\x7f", Escape:"\x1b",
  Delete:"\x1b[3~", ArrowUp:"\x1b[A", ArrowDown:"\x1b[B",
  ArrowRight:"\x1b[C", ArrowLeft:"\x1b[D", Home:"\x1b[H", End:"\x1b[F",
  PageUp:"\x1b[5~", PageDown:"\x1b[6~"};
let keyQueue = Promise.resolve();
function sendKeys(s) {
  if (!visiting) return;
  const ws = visiting;
  for (let i = 0; i < s.length; i += 200) {
    const part = s.slice(i, i + 200);
    keyQueue = keyQueue.then(() =>
      fetch(`/api/task/${ws}/keys`, {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({keys: part})})).catch(()=>{});
  }
}
$("#tdTerm").addEventListener("keydown", (e) => {
  if (visitMode !== "screen" || document.activeElement !== e.currentTarget) return;
  if (e.metaKey || e.altKey) return;            // the browser's business
  if (e.ctrlKey) {
    if (e.key === "v") return;                  // paste handled below
    if (/^[a-z]$/.test(e.key)) {
      sendKeys(String.fromCharCode(e.key.charCodeAt(0) - 96));
      e.preventDefault();
    }
    return;
  }
  const mapped = (e.key === "Tab" && e.shiftKey) ? "\x1b[Z"
    : (KEYMAP[e.key] ?? (e.key.length === 1 ? e.key : null));
  if (mapped !== null) { sendKeys(mapped); e.preventDefault(); }
});
$("#tdTerm").addEventListener("paste", (e) => {
  if (visitMode !== "screen") return;
  const t = e.clipboardData ? e.clipboardData.getData("text") : "";
  if (t) sendKeys(t);
  e.preventDefault();
});
$("#tdTerm").addEventListener("focus", () => {
  if (visitMode === "screen") $("#tdKeyHint").textContent = KEYHINT_LIVE;
});
$("#tdTerm").addEventListener("blur", () => {
  if (visitMode === "screen") $("#tdKeyHint").textContent = KEYHINT_IDLE;
});
// while the terminal holds focus, Esc belongs to it, not to the dialog
$("#taskdlg").addEventListener("cancel", (e) => {
  if (visitMode === "screen" && document.activeElement === $("#tdTerm"))
    e.preventDefault();
});
$("#tdChat").onclick = () => setVisitMode("chat");
$("#tdScreen").onclick = () => setVisitMode("screen");
// Minimal markdown for the Conversation view. Agent text is UNTRUSTED
// and this page holds human-plane powers, so everything is built as DOM
// nodes via textContent — never innerHTML, no sanitizer to get wrong.
function mdInline(s) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`\n]+`|\*\*[^*\n]+\*\*)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) frag.append(s.slice(last, m.index));
    const t = m[0];
    const el = document.createElement(t[0] === "`" ? "code" : "strong");
    el.textContent = t[0] === "`" ? t.slice(1, -1) : t.slice(2, -2);
    frag.append(el);
    last = m.index + t.length;
  }
  frag.append(s.slice(last));
  return frag;
}
function mdRender(container, text) {
  const lines = text.split("\n");
  const isItem = (l) => l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
  const isHead = (l) => l.match(/^#{1,4}\s+(.*)/);
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      const pre = document.createElement("pre");
      pre.textContent = buf.join("\n");
      container.append(pre); continue;
    }
    let m = isItem(l);
    if (m) {
      const list = document.createElement(/\d/.test(l.trim()[0]) ? "ol" : "ul");
      while (i < lines.length) {
        const it = isItem(lines[i]);
        if (it) {
          const li = document.createElement("li");
          li.append(mdInline(it[1]));
          list.append(li); i++;
        } else if (lines[i].match(/^\s+\S/) && list.lastChild) {
          // hanging indent: continuation of the previous item
          list.lastChild.append(" ", mdInline(lines[i].trim())); i++;
        } else break;
      }
      container.append(list); continue;
    }
    m = isHead(l);
    if (m) {
      const h = document.createElement("div");
      h.className = "mdh";
      h.append(mdInline(m[1]));
      container.append(h); i++; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith("```")
           && !isItem(lines[i]) && !isHead(lines[i])) buf.push(lines[i++]);
    const p = document.createElement("p");
    p.append(mdInline(buf.join("\n")));
    container.append(p);
  }
}
let lastChat = null;
async function pollVisit() {
  if (!visiting || visitMode !== "chat") return;
  const d = await fetch(`/api/task/${visiting}/messages`).then(r=>r.json());
  const el = $("#tdTerm");
  if (d.error) { el.textContent = d.error; lastChat = null; return; }
  const cache = visiting + JSON.stringify(d);
  if (cache === lastChat) return;  // unchanged: keep scroll + selection
  lastChat = cache;
  const msgs = d.messages || [];
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  const squeeze = (s) => (s||"").replace(/[ \t]+$/gm,"").replace(/\n{3,}/g,"\n\n").trim();
  el.replaceChildren();
  if (d.archived_at) {
    const b = document.createElement("div");
    b.className = "mdrole";
    b.textContent = `— archived transcript from ${new Date(d.archived_at*1000).toLocaleString()} (session not reachable; Resume/Start to go live) —`;
    el.append(b);
  }
  for (const m of msgs) {
    const h = document.createElement("div");
    h.className = "mdrole";
    h.textContent = m.role === "user" ? "──── you / fold ────" : "──── agent ────";
    el.append(h);
    mdRender(el, squeeze(m.message || m.content));
  }
  if (!msgs.length) el.textContent = "no output yet";
  if (stick) el.scrollTop = el.scrollHeight;
}
let visitingIsBW = false;
function openTask(ws, name, st) {
  visiting = ws;
  // bellwether runs are script executions, not sessions: the transcript
  // replays, but there is nothing to message, pause, or stop
  visitingIsBW = ws.startsWith("bellwether-");
  $("#tdPause").hidden = visitingIsBW;
  $("#tdStop").hidden = visitingIsBW;
  $("#tdScreen").hidden = visitingIsBW;
  $("#tdTitle").textContent = (name || ws) + (st && st!=="running" ? ` · ${st}` : "");
  $("#tdMsg").value = drafts[ws] || "";
  tdChips();
  $("#taskdlg").showModal();
  setVisitMode("chat");
  visitTimer = setInterval(pollVisit, 2500);
  // the open Visit survives a reload: the hash names it, drafts carry it
  if (location.hash !== "#visit=" + ws)
    history.replaceState(null, "", "#visit=" + ws);
}
function closeTask() {
  visiting = null;
  clearInterval(visitTimer);
  if (screenSrc) { screenSrc.close(); screenSrc = null; }
  history.replaceState(null, "", location.pathname + location.search);
  $("#taskdlg").close();
}
let deepLinked = false;
function tryDeepLink() {
  // reload with a Visit open: the hash reopens it (no SPA machinery —
  // one hash, read once, written by open/close)
  if (deepLinked) return;
  deepLinked = true;
  const m = location.hash.match(/^#visit=([\w.-]+)$/);
  if (!m || $("#taskdlg").open) return;
  const t = ((lastState || {}).tasks || []).find(x => x.workspace === m[1]);
  openTask(m[1], t ? t.name : m[1],
           t ? (t.frozen ? "frozen" : t.ws_status) : "");
}
$("#tdClose").onclick = closeTask;
// Backdrop click dismisses the Visit view — drafts persist, reopening
// reconnects. The dispatch/projects dialogs keep their explicit
// buttons: a stray click must not eat a half-written prompt. Dismissal
// requires the press to have STARTED outside too: releasing a textarea
// resize-drag (or a text selection) past the dialog's edge is not a
// backdrop click.
let pressOutside = false;
const outsideDlg = (e) => {
  const r = $("#taskdlg").getBoundingClientRect();
  return e.clientX < r.left || e.clientX > r.right ||
         e.clientY < r.top || e.clientY > r.bottom;
};
$("#taskdlg").addEventListener("pointerdown", (e) => {
  pressOutside = outsideDlg(e);
});
$("#taskdlg").addEventListener("click", (e) => {
  if (pressOutside && outsideDlg(e)) closeTask();
});
$("#taskdlg").addEventListener("close", () => {
  visiting=null; clearInterval(visitTimer);
  if (screenSrc) { screenSrc.close(); screenSrc = null; }
  if (location.hash.startsWith("#visit="))
    history.replaceState(null, "", location.pathname + location.search);
});
$("#tdPause").onclick = () => { act("pause", visiting); };
$("#tdStop").onclick = () => { const w=visiting; closeTask(); act("stop", w); };
// Unsent message drafts survive reloads, per task (the dispatch form
// already works this way; a half-written thought is work too).
const DRAFT_KEY = "fold-visit-drafts";
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; } catch (e) {}
function saveDrafts() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts)); } catch (e) {}
}
$("#tdMsg").addEventListener("input", () => {
  if (!visiting) return;
  const v = $("#tdMsg").value;
  if (v) drafts[visiting] = v; else delete drafts[visiting];
  saveDrafts();
});
$("#tdSend").onclick = async () => {
  const msg = $("#tdMsg").value.trim();
  if (!msg || !visiting) return;
  const ws = visiting;
  const r = await api(`/api/task/${ws}/message`, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({content: msg})});
  if (r.error) { toast(r.error); return; }  // box and draft keep the text
  $("#tdMsg").value = "";
  delete drafts[ws]; saveDrafts();
  lastChat = null;
  pollVisit();
};
$("#tdMsg").addEventListener("keydown", (e) => {
  // Enter sends; Shift+Enter is the newline. preventDefault keeps the
  // key from reaching anything else in the dialog.
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#tdSend").click(); }
});
// The box's dragged height is a preference, not a draft: remember it.
const MSGH_KEY = "fold-visit-msgh";
try {
  const h = +localStorage.getItem(MSGH_KEY);
  if (h > 40) $("#tdMsg").style.height = h + "px";
} catch (e) {}
new ResizeObserver(() => {
  const h = $("#tdMsg").offsetHeight;
  if ($("#taskdlg").open && !$(".msgrow").hidden && h > 40) {
    try { localStorage.setItem(MSGH_KEY, String(h)); } catch (e) {}
  }
}).observe($("#tdMsg"));
async function resolveHand(id) {
  await api("/api/resolve", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({id})});
  refresh();
}
function handCard(h) {
  const when = new Date(h.time * 1000).toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit"});
  return `<div class="card hand">
    <div class="t">✋ ${h.title.replace(/^raise-hand:\s*/,"")}</div>
    <div class="t" style="font-weight:400">${h.message}</div>
    <div class="m">${chip("attn", when)}${h.workspace ? " " + chip("neutral", h.workspace) : ""}${h.forwarded ? " " + chip("frozen", "→ " + h.forwarded.to) : ""}</div>
    <div class="a"><button class="quiet" onclick="resolveHand('${h.id}')">Resolve</button></div></div>`;
}
let repos = {}, repoDefault = null;
function fillRepoSelect() {
  const sel = $("#repoSel"); const names = Object.keys(repos);
  sel.hidden = !names.length;
  if (!names.length) return;
  const keep = sel.value || savedForm.repo;
  sel.innerHTML = names.map(n =>
    `<option value="${n}"${n===(keep||repoDefault)?" selected":""}>${n}${n===repoDefault?" (default)":""} — ${repos[n]}</option>`).join("");
}
let endpoints = {}, llmDefault = {};
function fillLlmSelects() {
  const lsel = $("#llmSel"), msel = $("#modelSel");
  const names = Object.keys(endpoints);
  if (!names.length) return;
  const keep = lsel.value || savedForm.llm;
  lsel.innerHTML = names.map(n =>
    `<option value="${n}"${n===(keep||llmDefault.endpoint)?" selected":""}>${n}${n===llmDefault.endpoint?" (default)":""}</option>`).join("");
  const cur = lsel.value;
  const keepM = msel.value || savedForm.model;
  msel.innerHTML = (endpoints[cur]||[]).map(m =>
    `<option value="${m}"${m===(keepM||llmDefault.model)?" selected":""}>${m}</option>`).join("");
}
document.addEventListener("change", (e) => { if (e.target.id === "llmSel") { $("#modelSel").value=""; fillLlmSelects(); } });

async function refresh() {
  let s;
  try {
    const r = await fetch("/api/state");
    if (!(r.headers.get("content-type") || "").includes("json")) throw 0;
    s = await r.json();
  } catch (e) {
    // a dead session must look dead, not merely stale
    $("#stats").innerHTML = chip("failed", "disconnected — reload the page (login likely expired)");
    return;
  }
  endpoints = s.endpoints || {}; llmDefault = s.llm_default || {};
  repos = s.repos || {}; repoDefault = s.repo_default || null;
  lastState = s;
  tryDeepLink();
  if ($("#taskdlg").open) tdChips();
  else { fillLlmSelects(); fillRepoSelect(); }
  $("#stats").innerHTML =
    chip("working", `${s.host.working}/${s.host.max_working} working`) +
    chip("neutral", `host ${s.host.avail_gib} GiB free`) +
    (s.hands.length ? chip("attn", `✋ ${s.hands.length}`) : "") +
    (s.bellwether && s.bellwether.totals && s.bellwether.totals.reviews
      ? chip("neutral", `🔔 ${s.bellwether.totals.reviews} reviews · ${fmtTok(s.bellwether.totals.input)}/${fmtTok(s.bellwether.totals.output)}`) : "") +
    (s.fleet.some(f=>f.status==="Frozen") ? chip("frozen","frozen present") : "");
  // preserve column scroll across re-renders: a jumped list under a
  // poised cursor once restarted a container by accident
  const scrolls = [...document.querySelectorAll("#board .cards")].map(el => el.scrollTop);
  $("#board").innerHTML = COLS.map(([name, pred]) => {
    let items = s.tasks.filter(pred);
    let extra = "";
    if (name === "Stopped" && items.length > 5) {
      const n = items.length - 5;
      items = items.slice(0, 5);
      extra = `<button class="quiet archbtn" onclick="setView('archive')">→ archive (${n} older)</button>`;
    }
    let cards = items.map(t => taskCard(t, name)).join("");
    if (name === "Needs you") cards = s.hands.map(handCard).join("") + cards;
    if (name === "Working" && s.bellwether && s.bellwether.active)
      cards = bellwetherCard(s.bellwether) + cards;
    cards = (cards || `<div class="card" style="color:var(--soft)">—</div>`) + extra;
    return `<div class="col${name==="Needs you"?" attn":""}"><h3>${name}${name==="Stopped"?` <span>${s.tasks.filter(pred).length}</span>`:""}</h3>
            <div class="cards">${cards}</div></div>`;
  }).join("");
  [...document.querySelectorAll("#board .cards")].forEach((el, i) => {
    if (scrolls[i]) el.scrollTop = scrolls[i];
  });
  // the favicon carries the sheep; the title carries exactly one live
  // signal — an open hand is the state worth a glance across tabs
  document.title = (s.hands.length ? "✋ " : "") + "fold";
  const stopped = s.tasks.filter(t => ["stopped","stopping"].includes(t.ws_status));
  $("#archTab").textContent = `Archive (${stopped.length})`;
  $("#boardTab").textContent = s.hands.length ? "Board ✋" : "Board";
  $("#archTable").innerHTML =
    `<tr><th>task</th><th>kind</th><th>prompt</th><th>tokens</th><th>last active</th><th></th></tr>` +
    stopped.map(t => `<tr>
      <td class="mono">${t.name}</td>
      <td>${chip("neutral", t.template || "?")}</td>
      <td style="max-width:34rem; overflow-wrap:anywhere;">${t.prompt}</td>
      <td class="mono">${t.tok ? `${fmtTok(t.tok.input)}/${fmtTok(t.tok.output)}` : "—"}</td>
      <td class="mono">${(t.updated || "").slice(0, 10)}</td>
      <td><button class="quiet archbtn" onclick="act('start','${t.workspace}')">Start</button>
          <button class="quiet archbtn" onclick="openTask('${t.workspace}','${t.name}','stopped')">Visit</button></td>
    </tr>`).join("");
  $("#fleet").innerHTML =
    `<tr><th>environment</th><th>state</th><th>memory</th><th></th></tr>` +
    s.fleet.map(f => {
      const cls = {Running:"working", Frozen:"frozen", Stopped:"neutral"}[f.status] || "neutral";
      const ws = f.name.replace(/^fold-/, "");
      const btn = f.status==="Frozen"
        ? `<button class="quiet" onclick="act('resume','${ws}')">Resume</button>`
        : f.status==="Running"
        ? `<button class="quiet" onclick="act('pause','${ws}')">Pause</button>` : "";
      return `<tr><td class="mono">${f.name}</td><td>${chip(cls, f.status)}</td>
              <td class="mono">${f.mem_mib ? f.mem_mib + " MiB" : "—"}</td><td>${btn}</td></tr>`;
    }).join("");
}
function renderProjects() {
  $("#projList").innerHTML = `<tr style="text-align:left; color:var(--soft);"><th>project</th><th>repo</th></tr>` +
    (Object.keys(repos).length ? Object.entries(repos).map(([k, v]) =>
      `<tr><td>${k}${k===repoDefault ? " ★" : ""}</td><td class="mono">${v}</td></tr>`).join("")
     : `<tr><td colspan="2" style="color:var(--soft);">none registered yet</td></tr>`);
}
$("#projBtn").onclick = () => { renderProjects(); $("#projdlg").showModal(); };
$("#projClose").onclick = () => $("#projdlg").close();
$("#projAdd").onclick = async () => {
  const body = {path: $("#projPath").value.trim(),
                name: $("#projName").value.trim() || undefined,
                review: $("#projReview").value,
                create: $("#projCreate").checked || undefined,
                default: $("#projDefault").checked || undefined};
  if (!/^[\w.-]+\/[\w.-]+$/.test(body.path)) return toast("owner/name required");
  toast("registering…");
  const r = await api("/api/repos/add", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if (r.ok) {
    $("#projPath").value = ""; $("#projName").value = "";
    clearDraft(["projPath", "projName"]);
  }
  toast(r.out || (r.ok ? "registered" : "failed"));
  await refresh(); renderProjects();
};
$("#dispatchBtn").onclick = () => $("#dlg").showModal();
$("#cancel").onclick = () => $("#dlg").close();
$("#go").onclick = async () => {
  let promptText = $("#prompt").value.trim();
  if (promptText && $("#discussFirst").checked) promptText =
    "DESIGN DISCUSSION FIRST — do not begin the work yet. Read whatever " +
    "context you need (your checkout, the contract), then discuss the " +
    "goal with the human through this session: they will message you " +
    "here. Ask questions, surface options and trade-offs, and converge " +
    "on scope together. Begin implementation only when the human " +
    "explicitly says to proceed; resting between replies is correct.\n\n" +
    "The goal to discuss:\n" + promptText;
  const body = {template: $("#tpl").value, prompt: promptText,
                repo: $("#repoSel").value || undefined,
                llm: $("#llmSel").value || undefined,
                model: $("#modelSel").value || undefined};
  if (!body.prompt) return toast("write the task first");
  $("#dlg").close(); toast("dispatching…");
  const r = await api("/api/dispatch", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if (r.ok) { $("#prompt").value = ""; clearDraft(["prompt"]); }
  toast(r.out || (r.ok ? "dispatched" : "failed")); refresh();
};
// restore drafts, then keep saving them as they are typed
if (savedForm.prompt) $("#prompt").value = savedForm.prompt;
if (savedForm.tpl) $("#tpl").value = savedForm.tpl;
if (savedForm.projPath) $("#projPath").value = savedForm.projPath;
if (savedForm.projName) $("#projName").value = savedForm.projName;
for (const id of ["prompt", "tpl", "repoSel", "llmSel", "modelSel",
                  "projPath", "projName"]) {
  $("#" + id).addEventListener("input", saveForm);
  $("#" + id).addEventListener("change", saveForm);
}
refresh();
// SSE keeps the board fresh; the interval is only a reconnect fallback.
try {
  const es = new EventSource("/api/events");
  es.onmessage = () => refresh();
  setInterval(refresh, 60000);
} catch (e) {
  setInterval(refresh, 5000);
}
</script>
</body>
