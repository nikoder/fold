<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fold</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EDEFEA; --surface: #FFFFFF; --raised: #F4F6F1;
    --ink: #232922; --soft: #677064; --line: #D9DDD3;
    --accent: #3E6F4F; --accent-contrast: #FFFFFF;
    --working: #47708C; --working-bg: #E3ECF2;
    --attn: #A87B2A;    --attn-bg: #F5EBD6;
    --frozen: #736C8C;  --frozen-bg: #EAE8F1;
    --failed: #A5442A;  --failed-bg: #F4E2DB;
    --done: #3E6F4F;    --done-bg: #DFEAE2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1E19; --surface: #232823; --raised: #2A302A;
      --ink: #E2E6DE; --soft: #98A093; --line: #38403A;
      --accent: #82B292; --accent-contrast: #14261B;
      --working: #86AECB; --working-bg: #23313C;
      --attn: #D9AE5F;    --attn-bg: #3B3221;
      --frozen: #A79FC4;  --frozen-bg: #2E2B3C;
      --failed: #D07B5E;  --failed-bg: #3D2620;
      --done: #8FBE9F;    --done-bg: #24352A;
    }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"IBM Plex Sans",sans-serif; font-size:.85rem; }
  .topbar { display:flex; align-items:center; gap:1rem; background:var(--surface);
            border-bottom:1px solid var(--line); padding:.65rem 1rem; }
  .wordmark { font-family:"Bricolage Grotesque",sans-serif; font-weight:650; font-size:1.1rem; }
  .wordmark::after { content:"·"; color:var(--accent); margin-left:.15em; }
  .stats { display:flex; gap:.5rem; flex:1; flex-wrap:wrap; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.04em;
          padding:.14em .5em; border-radius:999px; white-space:nowrap; }
  .chip.working { background:var(--working-bg); color:var(--working); }
  .chip.attn { background:var(--attn-bg); color:var(--attn); border:1px dashed var(--attn); }
  .chip.frozen { background:var(--frozen-bg); color:var(--frozen); }
  .chip.failed { background:var(--failed-bg); color:var(--failed); }
  .chip.done { background:var(--done-bg); color:var(--done); }
  .chip.neutral { background:var(--raised); color:var(--soft); border:1px solid var(--line); }
  button { font:inherit; font-weight:600; border:none; border-radius:6px;
           padding:.42em .9em; cursor:pointer; background:var(--accent); color:var(--accent-contrast); }
  button.quiet { background:var(--raised); color:var(--ink); border:1px solid var(--line); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { padding:1rem; }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:.8rem; }
  .col h3 { font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.1em;
            text-transform:uppercase; color:var(--soft); font-weight:500; margin:.2rem 0 .6rem; }
  .col.attn h3 { color:var(--attn); }
  .cards { display:flex; flex-direction:column; gap:.6rem; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px;
          padding:.6rem .7rem; display:flex; flex-direction:column; gap:.4rem; }
  .card.hand { border-color:var(--attn); box-shadow:0 0 0 1px var(--attn); }
  .card .t { font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
  .card .m { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
  .card .a { display:flex; gap:.4rem; }
  .card .a button { font-size:.68rem; padding:.28em .6em; }
  h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:1rem; margin:1.6rem 0 .6rem; }
  table { border-collapse:collapse; width:100%; background:var(--surface);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th { font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.08em;
       text-transform:uppercase; color:var(--soft); font-weight:500; text-align:left;
       padding:.5rem .7rem; border-bottom:1px solid var(--line); }
  td { padding:.45rem .7rem; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  .mono { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--surface);
           color:var(--ink); padding:1rem; width:min(460px,90vw); }
  dialog::backdrop { background:rgba(20,25,18,.45); }
  dialog h4 { margin:.1rem 0 .8rem; font-family:"Bricolage Grotesque",sans-serif; }
  dialog select, dialog textarea { width:100%; font:inherit; font-size:.8rem;
    background:var(--raised); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:.45em .6em; box-sizing:border-box; margin-bottom:.6rem; }
  dialog textarea { min-height:90px; resize:vertical; }
  .drow { display:flex; justify-content:flex-end; gap:.5rem; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--ink); color:var(--bg); padding:.5em 1em; border-radius:8px;
           font-size:.78rem; opacity:0; transition:opacity .2s; max-width:80vw; }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">fold</span>
    <div class="stats" id="stats"></div>
    <button id="dispatchBtn">Dispatch task</button>
  </div>
  <main>
    <div class="board" id="board"></div>
    <h2>Fleet</h2>
    <table id="fleet"></table>
  </main>

  <dialog id="dlg">
    <h4>Dispatch task</h4>
    <select id="tpl">
      <option value="fold-incus">fold-incus (incus instance)</option>
      <option value="tasks-docker">tasks-docker (docker container)</option>
    </select>
    <textarea id="prompt" placeholder="Task for the agent — AGENTS.md carries the workflow; write only the work itself."></textarea>
    <div class="drow">
      <button class="quiet" id="cancel">Cancel</button>
      <button id="go">Dispatch</button>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const COLS = [
  ["Queued", (t) => ["pending","starting"].includes(t.ws_status)],
  ["Working", (t) => t.ws_status==="running" && t.task_state==="working"],
  ["Needs you", (t) => t.ws_status==="failed" ||
                       ["start_error","start_timeout"].includes(t.agent||"")],
  ["Idle", (t) => t.ws_status==="running" && t.task_state!=="working"],
  ["Stopped", (t) => ["stopped","stopping"].includes(t.ws_status)],
];
function chip(cls, text) { return `<span class="chip ${cls}">${text}</span>`; }
function stChip(t) {
  if (t.ws_status==="failed") return chip("failed","failed");
  if (t.ws_status==="running" && t.task_state==="working") return chip("working","working");
  if (t.ws_status==="running") return chip("done","idle");
  return chip("neutral", t.ws_status);
}
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3500);
}
async function act(verb, ws) {
  toast(`${verb} ${ws}…`);
  const r = await fetch("/api/action", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({verb, workspace: ws})}).then(r=>r.json());
  toast(r.out || (r.ok ? "done" : "failed")); refresh();
}
function taskCard(t, colName) {
  const acts = [];
  if (t.ws_status==="running") acts.push(`<button class="quiet" onclick="act('pause','${t.workspace}')">Pause</button>`,
                                         `<button class="quiet" onclick="act('stop','${t.workspace}')">Stop</button>`);
  const hand = colName==="Needs you";
  return `<div class="card${hand?" hand":""}">
    <div class="t">${t.prompt || t.name}</div>
    <div class="m">${stChip(t)} ${chip("neutral", t.name)}</div>
    <div class="a">${acts.join("")}</div></div>`;
}
async function resolveHand(id) {
  await fetch("/api/resolve", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({id})});
  refresh();
}
function handCard(h) {
  const when = new Date(h.time * 1000).toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit"});
  return `<div class="card hand">
    <div class="t">✋ ${h.title.replace(/^raise-hand:\s*/,"")}</div>
    <div class="t" style="font-weight:400">${h.message}</div>
    <div class="m">${chip("attn", when)}</div>
    <div class="a"><button class="quiet" onclick="resolveHand('${h.id}')">Resolve</button></div></div>`;
}
async function refresh() {
  const s = await fetch("/api/state").then(r=>r.json());
  $("#stats").innerHTML =
    chip("working", `${s.host.working}/${s.host.max_working} working`) +
    chip("neutral", `host ${s.host.avail_gib} GiB free`) +
    (s.hands.length ? chip("attn", `✋ ${s.hands.length}`) : "") +
    (s.fleet.some(f=>f.status==="Frozen") ? chip("frozen","frozen present") : "");
  $("#board").innerHTML = COLS.map(([name, pred]) => {
    let cards = s.tasks.filter(pred).map(t => taskCard(t, name)).join("");
    if (name === "Needs you") cards = s.hands.map(handCard).join("") + cards;
    cards = cards || `<div class="card" style="color:var(--soft)">—</div>`;
    return `<div class="col${name==="Needs you"?" attn":""}"><h3>${name}</h3>
            <div class="cards">${cards}</div></div>`;
  }).join("");
  $("#fleet").innerHTML =
    `<tr><th>environment</th><th>state</th><th>memory</th><th></th></tr>` +
    s.fleet.map(f => {
      const cls = {Running:"working", Frozen:"frozen", Stopped:"neutral"}[f.status] || "neutral";
      const ws = f.name.replace(/^coder-[^-]+-/, "");
      const btn = f.status==="Frozen"
        ? `<button class="quiet" onclick="act('resume','${ws}')">Resume</button>`
        : f.status==="Running"
        ? `<button class="quiet" onclick="act('pause','${ws}')">Pause</button>` : "";
      return `<tr><td class="mono">${f.name}</td><td>${chip(cls, f.status)}</td>
              <td class="mono">${f.mem_mib ? f.mem_mib + " MiB" : "—"}</td><td>${btn}</td></tr>`;
    }).join("");
}
$("#dispatchBtn").onclick = () => $("#dlg").showModal();
$("#cancel").onclick = () => $("#dlg").close();
$("#go").onclick = async () => {
  const body = {template: $("#tpl").value, prompt: $("#prompt").value.trim()};
  if (!body.prompt) return toast("write the task first");
  $("#dlg").close(); toast("dispatching…");
  const r = await fetch("/api/dispatch", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
    .then(r=>r.json());
  toast(r.out || (r.ok ? "dispatched" : "failed")); refresh();
};
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
