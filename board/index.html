<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fold</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EDEFEA; --surface: #FFFFFF; --raised: #F4F6F1;
    --ink: #232922; --soft: #677064; --line: #D9DDD3;
    --accent: #3E6F4F; --accent-contrast: #FFFFFF;
    --working: #47708C; --working-bg: #E3ECF2;
    --attn: #A87B2A;    --attn-bg: #F5EBD6;
    --frozen: #736C8C;  --frozen-bg: #EAE8F1;
    --failed: #A5442A;  --failed-bg: #F4E2DB;
    --done: #3E6F4F;    --done-bg: #DFEAE2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1E19; --surface: #232823; --raised: #2A302A;
      --ink: #E2E6DE; --soft: #98A093; --line: #38403A;
      --accent: #82B292; --accent-contrast: #14261B;
      --working: #86AECB; --working-bg: #23313C;
      --attn: #D9AE5F;    --attn-bg: #3B3221;
      --frozen: #A79FC4;  --frozen-bg: #2E2B3C;
      --failed: #D07B5E;  --failed-bg: #3D2620;
      --done: #8FBE9F;    --done-bg: #24352A;
    }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"IBM Plex Sans",sans-serif; font-size:.85rem; }
  /* hidden must beat any display rule (.board's grid was ignoring it) */
  [hidden] { display:none !important; }
  .topbar { display:flex; align-items:center; gap:1rem; background:var(--surface);
            border-bottom:1px solid var(--line); padding:.65rem 1rem; }
  .wordmark { font-family:"Bricolage Grotesque",sans-serif; font-weight:650; font-size:1.1rem; }
  .wordmark::after { content:"·"; color:var(--accent); margin-left:.15em; }
  .stats { display:flex; gap:.5rem; flex:1; flex-wrap:wrap; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.04em;
          padding:.14em .5em; border-radius:999px; white-space:nowrap; }
  .chip.working { background:var(--working-bg); color:var(--working); }
  .chip.attn { background:var(--attn-bg); color:var(--attn); border:1px dashed var(--attn); }
  .chip.frozen { background:var(--frozen-bg); color:var(--frozen); }
  .chip.failed { background:var(--failed-bg); color:var(--failed); }
  .chip.done { background:var(--done-bg); color:var(--done); }
  .chip.neutral { background:var(--raised); color:var(--soft); border:1px solid var(--line); }
  button { font:inherit; font-weight:600; border:none; border-radius:6px;
           padding:.42em .9em; cursor:pointer; background:var(--accent); color:var(--accent-contrast); }
  button.quiet { background:var(--raised); color:var(--ink); border:1px solid var(--line); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { padding:1rem; }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:.8rem; }
  .col h3 { font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.1em;
            text-transform:uppercase; color:var(--soft); font-weight:500; margin:.2rem 0 .6rem; }
  .col.attn h3 { color:var(--attn); }
  /* each view owns its whole tab: columns get the full viewport height,
     scrolling internally */
  .cards { display:flex; flex-direction:column; gap:.6rem;
           max-height:calc(100vh - 11rem); overflow-y:auto;
           scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .cards::-webkit-scrollbar, .term::-webkit-scrollbar { width:8px; }
  .cards::-webkit-scrollbar-thumb, .term::-webkit-scrollbar-thumb {
    background:var(--line); border-radius:4px; }
  .cards::-webkit-scrollbar-track, .term::-webkit-scrollbar-track {
    background:transparent; }
  .term { scrollbar-width:thin; scrollbar-color:#333A31 transparent; }
  .archbtn { font-size:.68rem; padding:.3em .6em; align-self:flex-start; }
  .tabs { display:flex; gap:1.1rem; padding:.55rem 1rem 0; background:var(--surface);
          border-bottom:1px solid var(--line); }
  .tab { background:none; border:none; font:inherit; font-weight:600; cursor:pointer;
         color:var(--soft); padding:.15rem .1rem .45rem; border-bottom:2px solid transparent; }
  .tab.active { color:var(--ink); border-bottom-color:var(--accent); }
  .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px;
          padding:.6rem .7rem; display:flex; flex-direction:column; gap:.4rem; }
  .card.hand { border-color:var(--attn); box-shadow:0 0 0 1px var(--attn); }
  .card.shepherd { border-left:4px solid var(--accent); background:
    linear-gradient(to right, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 40%); }
  .chip.shepherd { background:var(--done-bg); color:var(--done); border:1px solid var(--done); }
  .card .t { font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
  .card .m { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
  .card .a { display:flex; gap:.4rem; }
  .card .a button { font-size:.68rem; padding:.28em .6em; }
  h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:1rem; margin:1.6rem 0 .6rem; }
  table { border-collapse:collapse; width:100%; background:var(--surface);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th { font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.08em;
       text-transform:uppercase; color:var(--soft); font-weight:500; text-align:left;
       padding:.5rem .7rem; border-bottom:1px solid var(--line); }
  td { padding:.45rem .7rem; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  .mono { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--surface);
           color:var(--ink); padding:1rem; width:min(460px,90vw); }
  dialog::backdrop { background:rgba(20,25,18,.45); }
  dialog h4 { margin:.1rem 0 .8rem; font-family:"Bricolage Grotesque",sans-serif; }
  dialog select, dialog textarea, dialog input:not([type=checkbox]) {
    width:100%; font:inherit; font-size:.8rem;
    background:var(--raised); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:.45em .6em; box-sizing:border-box; margin-bottom:.6rem; }
  dialog textarea { min-height:90px; resize:vertical; }
  .drow { display:flex; justify-content:flex-end; gap:.5rem; }
  .term { background:#10140F; color:#C9D4C4; font-family:"IBM Plex Mono",monospace;
          font-size:.74rem; line-height:1.5; border-radius:8px; padding:.8rem .9rem;
          flex:1; min-height:300px; overflow-y:auto; white-space:pre-wrap; overflow-wrap:anywhere; }
  /* no display on the base rule: it would override the UA's display:none
     for closed dialogs (symptom: modal lingers after close until reflow) */
  #taskdlg { width:min(1100px,96vw); height:min(88vh,950px);
             flex-direction:column; }
  #taskdlg[open] { display:flex; }
  .msgrow { display:flex; gap:.5rem; margin-top:.6rem; }
  .msgrow input { flex:1; font:inherit; font-size:.8rem; background:var(--raised);
    color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:.45em .6em; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--ink); color:var(--bg); padding:.5em 1em; border-radius:8px;
           font-size:.78rem; opacity:0; transition:opacity .2s; max-width:80vw; }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">fold</span>
    <div class="stats" id="stats"></div>
    <button class="quiet" id="projBtn">Projects</button>
    <button id="dispatchBtn">Dispatch task</button>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="board" id="boardTab">Board</button>
    <button class="tab" data-view="archive" id="archTab">Archive</button>
    <button class="tab" data-view="fleet">Fleet</button>
  </nav>
  <main>
    <div class="board" id="board"></div>
    <div id="archive" hidden>
      <table id="archTable"></table>
    </div>
    <div id="fleetView" hidden>
      <table id="fleet"></table>
    </div>
  </main>

  <dialog id="dlg">
    <h4>Dispatch task</h4>
    <select id="tpl">
      <option value="agent">agent (fold-native, golden image)</option>
      <option value="shepherd">shepherd (fold-native planning session)</option>
      <option value="fold-incus">fold-incus (Coder, legacy)</option>
      <option value="fold-shepherd">fold-shepherd (Coder, legacy)</option>
      <option value="tasks-docker">tasks-docker (Coder, legacy)</option>
    </select>
    <select id="repoSel" aria-label="Project repo"></select>
    <div style="display:flex; gap:.5rem;">
      <select id="llmSel" style="flex:1;" aria-label="Inference endpoint"></select>
      <select id="modelSel" style="flex:2;" aria-label="Model"></select>
    </div>
    <textarea id="prompt" placeholder="Task for the agent — AGENTS.md carries the workflow; write only the work itself."></textarea>
    <div class="drow">
      <button class="quiet" id="cancel">Cancel</button>
      <button id="go">Dispatch</button>
    </div>
  </dialog>
  <dialog id="projdlg">
    <h4>Projects</h4>
    <table id="projList" style="width:100%; font-size:.78rem; border-collapse:collapse; margin-bottom:.9rem;"></table>
    <h4>Register a repo</h4>
    <input id="projPath" placeholder="owner/name on the forge">
    <div style="display:flex; gap:.5rem;">
      <input id="projName" placeholder="project name (default: repo name)" style="flex:1;">
      <select id="projReview" style="flex:1;">
        <option value="bellwether">review: bellwether</option>
        <option value="human">review: human (merge-means-deploy)</option>
      </select>
    </div>
    <label style="font-size:.78rem; display:block; margin-bottom:.3rem;"><input type="checkbox" id="projCreate"> create the repo on the forge (lands under the forge token's own account; else it must exist)</label>
    <label style="font-size:.78rem; display:block; margin-bottom:.6rem;"><input type="checkbox" id="projDefault"> make it the dispatch default</label>
    <div class="drow">
      <button class="quiet" id="projClose">Close</button>
      <button id="projAdd">Register</button>
    </div>
  </dialog>
  <dialog id="taskdlg">
    <h4 id="tdTitle">task</h4>
    <div class="term" id="tdTerm">connecting…</div>
    <div class="msgrow">
      <input id="tdMsg" placeholder="Message the agent (lands in its session via agentapi)…">
      <button id="tdSend">Send</button>
    </div>
    <div class="drow" style="margin-top:.6rem;">
      <button class="quiet" id="tdPause">Pause</button>
      <button class="quiet" id="tdStop">Stop</button>
      <button class="quiet" id="tdClose">Close</button>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const COLS = [
  ["Queued", (t) => ["pending","starting"].includes(t.ws_status)],
  ["Working", (t) => t.ws_status==="running" && !t.frozen && t.task_state==="working"],
  ["Needs you", (t) => t.ws_status==="failed" ||
                       ["start_error","start_timeout"].includes(t.agent||"")],
  ["Idle", (t) => t.ws_status==="running" && (t.frozen || t.task_state!=="working")],
  ["Stopped", (t) => ["stopped","stopping"].includes(t.ws_status)],
];
function chip(cls, text) { return `<span class="chip ${cls}">${text}</span>`; }
function fmtTok(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n); }
function tokChips(t) {
  if (!t.tok) return "";
  // input = context weight (grows as the task grinds); output = generation.
  let s = " " + chip("neutral", `in ${fmtTok(t.tok.input)} · out ${fmtTok(t.tok.output)}`);
  // live context size (single-turn input), not the billing sum: peak
  // answers "how big did this task's mind get"
  if (t.tok.peak_ctx) s += " " + chip("neutral", `ctx ${fmtTok(t.tok.peak_ctx)}`);
  if (t.tok.cache_read) s += " " + chip("neutral", `cached ${fmtTok(t.tok.cache_read)}`);
  // intensity: output rate, time-averaged between harvests. The endpoint
  // does ~6k tok/min flat out single-stream, so sustained thousands here
  // means "generating almost continuously" — the runaway signature.
  if (t.tok.out_per_min > 0 && t.ws_status === "running")
    s += " " + chip(t.tok.out_per_min > 2000 ? "attn" : "neutral", `${fmtTok(t.tok.out_per_min)}/min out`);
  return s;
}
function stChip(t) {
  if (t.frozen) return chip("frozen","frozen");
  if (t.ws_status==="failed") return chip("failed","failed");
  if (t.ws_status==="running" && t.task_state==="working") return chip("working","working");
  if (t.ws_status==="running") return chip("done","idle");
  return chip("neutral", t.ws_status);
}
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3500);
}
async function act(verb, ws) {
  toast(`${verb} ${ws}…`);
  const r = await fetch("/api/action", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({verb, workspace: ws})}).then(r=>r.json());
  toast(r.out || (r.ok ? "done" : "failed")); refresh();
}
function taskCard(t, colName) {
  const acts = [`<button class="quiet" onclick="openTask('${t.workspace}','${t.name}','${t.frozen ? "frozen" : t.ws_status}')">Visit</button>`];
  if (t.frozen) acts.push(`<button class="quiet" onclick="act('resume','${t.workspace}')">Resume</button>`);
  else if (t.ws_status==="running") acts.push(`<button class="quiet" onclick="act('pause','${t.workspace}')">Pause</button>`,
                                              `<button class="quiet" onclick="act('stop','${t.workspace}')">Stop</button>`);
  else if (["stopped"].includes(t.ws_status)) acts.push(`<button class="quiet" onclick="act('start','${t.workspace}')">Start</button>`);
  const hand = colName==="Needs you";
  const shep = (t.template||"").includes("shepherd");
  return `<div class="card${hand?" hand":""}${shep?" shepherd":""}">
    <div class="t">${t.prompt || t.name}</div>
    <div class="m">${shep ? chip("shepherd","shepherd") + " " : ""}${stChip(t)} ${chip("neutral", t.name)}${t.project ? " " + chip("neutral", "⌂ " + t.project) : ""}${t.model ? " " + chip("neutral", t.model.length > 18 ? t.model.slice(0,16)+"…" : t.model) : ""}${t.ctx ? " " + chip("neutral", "ctx " + t.ctx) : ""}${tokChips(t)}</div>
    <div class="a">${acts.join("")}</div></div>`;
}

let visiting = null, visitTimer = null;
const VIEWS = {board: "#board", archive: "#archive", fleet: "#fleetView"};
function setView(v) {
  for (const [name, sel] of Object.entries(VIEWS)) $(sel).hidden = name !== v;
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.view === v));
}
document.querySelectorAll(".tab").forEach(t =>
  t.onclick = () => setView(t.dataset.view));
async function pollVisit() {
  if (!visiting) return;
  const d = await fetch(`/api/task/${visiting}/messages`).then(r=>r.json());
  const el = $("#tdTerm");
  if (d.error) { el.textContent = d.error; return; }
  const msgs = d.messages || [];
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  const banner = d.archived_at
    ? `— archived transcript from ${new Date(d.archived_at*1000).toLocaleString()} (session not reachable; Resume/Start to go live) —\n\n` : "";
  const squeeze = (s) => (s||"").replace(/[ \t]+$/gm,"").replace(/\n{3,}/g,"\n\n").trim();
  const body = msgs.map(m =>
    (m.role === "user" ? "──── you / fold ────\n" : "──── agent ────\n")
    + squeeze(m.message || m.content)).join("\n\n") || "no output yet";
  el.textContent = banner + body;
  if (stick) el.scrollTop = el.scrollHeight;
}
function openTask(ws, name, st) {
  visiting = ws;
  $("#tdTitle").textContent = (name || ws) + (st && st!=="running" ? ` · ${st}` : "");
  $("#tdTerm").textContent = "connecting…";
  $("#taskdlg").showModal();
  pollVisit();
  visitTimer = setInterval(pollVisit, 2500);
}
function closeTask() {
  visiting = null;
  clearInterval(visitTimer);
  $("#taskdlg").close();
}
$("#tdClose").onclick = closeTask;
$("#taskdlg").addEventListener("close", () => { visiting=null; clearInterval(visitTimer); });
$("#tdPause").onclick = () => { act("pause", visiting); };
$("#tdStop").onclick = () => { const w=visiting; closeTask(); act("stop", w); };
$("#tdSend").onclick = async () => {
  const msg = $("#tdMsg").value.trim();
  if (!msg || !visiting) return;
  $("#tdMsg").value = "";
  const r = await fetch(`/api/task/${visiting}/message`, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({content: msg})}).then(r=>r.json());
  if (r.error) toast(r.error); else pollVisit();
};
$("#tdMsg").addEventListener("keydown", (e) => { if (e.key==="Enter") $("#tdSend").click(); });
async function resolveHand(id) {
  await fetch("/api/resolve", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({id})});
  refresh();
}
function handCard(h) {
  const when = new Date(h.time * 1000).toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit"});
  return `<div class="card hand">
    <div class="t">✋ ${h.title.replace(/^raise-hand:\s*/,"")}</div>
    <div class="t" style="font-weight:400">${h.message}</div>
    <div class="m">${chip("attn", when)}${h.workspace ? " " + chip("neutral", h.workspace) : ""}${h.forwarded ? " " + chip("frozen", "→ " + h.forwarded.to) : ""}</div>
    <div class="a"><button class="quiet" onclick="resolveHand('${h.id}')">Resolve</button></div></div>`;
}
let repos = {}, repoDefault = null;
function fillRepoSelect() {
  const sel = $("#repoSel"); const names = Object.keys(repos);
  sel.hidden = !names.length;
  if (!names.length) return;
  const keep = sel.value;
  sel.innerHTML = names.map(n =>
    `<option value="${n}"${n===(keep||repoDefault)?" selected":""}>${n}${n===repoDefault?" (default)":""} — ${repos[n]}</option>`).join("");
}
let endpoints = {}, llmDefault = {};
function fillLlmSelects() {
  const lsel = $("#llmSel"), msel = $("#modelSel");
  const names = Object.keys(endpoints);
  if (!names.length) return;
  const keep = lsel.value;
  lsel.innerHTML = names.map(n =>
    `<option value="${n}"${n===(keep||llmDefault.endpoint)?" selected":""}>${n}${n===llmDefault.endpoint?" (default)":""}</option>`).join("");
  const cur = lsel.value;
  const keepM = msel.value;
  msel.innerHTML = (endpoints[cur]||[]).map(m =>
    `<option value="${m}"${m===(keepM||llmDefault.model)?" selected":""}>${m}</option>`).join("");
}
document.addEventListener("change", (e) => { if (e.target.id === "llmSel") { $("#modelSel").value=""; fillLlmSelects(); } });

async function refresh() {
  const s = await fetch("/api/state").then(r=>r.json());
  endpoints = s.endpoints || {}; llmDefault = s.llm_default || {};
  repos = s.repos || {}; repoDefault = s.repo_default || null;
  if (!$("#taskdlg").open) { fillLlmSelects(); fillRepoSelect(); }
  $("#stats").innerHTML =
    chip("working", `${s.host.working}/${s.host.max_working} working`) +
    chip("neutral", `host ${s.host.avail_gib} GiB free`) +
    (s.hands.length ? chip("attn", `✋ ${s.hands.length}`) : "") +
    (s.fleet.some(f=>f.status==="Frozen") ? chip("frozen","frozen present") : "");
  // preserve column scroll across re-renders: a jumped list under a
  // poised cursor once restarted a container by accident
  const scrolls = [...document.querySelectorAll("#board .cards")].map(el => el.scrollTop);
  $("#board").innerHTML = COLS.map(([name, pred]) => {
    let items = s.tasks.filter(pred);
    let extra = "";
    if (name === "Stopped" && items.length > 5) {
      const n = items.length - 5;
      items = items.slice(0, 5);
      extra = `<button class="quiet archbtn" onclick="setView('archive')">→ archive (${n} older)</button>`;
    }
    let cards = items.map(t => taskCard(t, name)).join("");
    if (name === "Needs you") cards = s.hands.map(handCard).join("") + cards;
    cards = (cards || `<div class="card" style="color:var(--soft)">—</div>`) + extra;
    return `<div class="col${name==="Needs you"?" attn":""}"><h3>${name}${name==="Stopped"?` <span>${s.tasks.filter(pred).length}</span>`:""}</h3>
            <div class="cards">${cards}</div></div>`;
  }).join("");
  [...document.querySelectorAll("#board .cards")].forEach((el, i) => {
    if (scrolls[i]) el.scrollTop = scrolls[i];
  });
  const stopped = s.tasks.filter(t => ["stopped","stopping"].includes(t.ws_status));
  $("#archTab").textContent = `Archive (${stopped.length})`;
  $("#boardTab").textContent = s.hands.length ? "Board ✋" : "Board";
  $("#archTable").innerHTML =
    `<tr><th>task</th><th>kind</th><th>prompt</th><th>tokens</th><th>last active</th><th></th></tr>` +
    stopped.map(t => `<tr>
      <td class="mono">${t.name}</td>
      <td>${chip("neutral", t.template || "?")}</td>
      <td style="max-width:34rem; overflow-wrap:anywhere;">${t.prompt}</td>
      <td class="mono">${t.tok ? `${fmtTok(t.tok.input)}/${fmtTok(t.tok.output)}` : "—"}</td>
      <td class="mono">${(t.updated || "").slice(0, 10)}</td>
      <td><button class="quiet archbtn" onclick="act('start','${t.workspace}')">Start</button>
          <button class="quiet archbtn" onclick="openTask('${t.workspace}','${t.name}','stopped')">Visit</button></td>
    </tr>`).join("");
  $("#fleet").innerHTML =
    `<tr><th>environment</th><th>state</th><th>memory</th><th></th></tr>` +
    s.fleet.map(f => {
      const cls = {Running:"working", Frozen:"frozen", Stopped:"neutral"}[f.status] || "neutral";
      const ws = f.name.replace(/^coder-[^-]+-/, "");
      const btn = f.status==="Frozen"
        ? `<button class="quiet" onclick="act('resume','${ws}')">Resume</button>`
        : f.status==="Running"
        ? `<button class="quiet" onclick="act('pause','${ws}')">Pause</button>` : "";
      return `<tr><td class="mono">${f.name}</td><td>${chip(cls, f.status)}</td>
              <td class="mono">${f.mem_mib ? f.mem_mib + " MiB" : "—"}</td><td>${btn}</td></tr>`;
    }).join("");
}
function renderProjects() {
  $("#projList").innerHTML = `<tr style="text-align:left; color:var(--soft);"><th>project</th><th>repo</th></tr>` +
    (Object.keys(repos).length ? Object.entries(repos).map(([k, v]) =>
      `<tr><td>${k}${k===repoDefault ? " ★" : ""}</td><td class="mono">${v}</td></tr>`).join("")
     : `<tr><td colspan="2" style="color:var(--soft);">none registered yet</td></tr>`);
}
$("#projBtn").onclick = () => { renderProjects(); $("#projdlg").showModal(); };
$("#projClose").onclick = () => $("#projdlg").close();
$("#projAdd").onclick = async () => {
  const body = {path: $("#projPath").value.trim(),
                name: $("#projName").value.trim() || undefined,
                review: $("#projReview").value,
                create: $("#projCreate").checked || undefined,
                default: $("#projDefault").checked || undefined};
  if (!/^[\w.-]+\/[\w.-]+$/.test(body.path)) return toast("owner/name required");
  toast("registering…");
  const r = await fetch("/api/repos/add", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
    .then(r=>r.json());
  toast(r.out || (r.ok ? "registered" : "failed"));
  await refresh(); renderProjects();
};
$("#dispatchBtn").onclick = () => $("#dlg").showModal();
$("#cancel").onclick = () => $("#dlg").close();
$("#go").onclick = async () => {
  const body = {template: $("#tpl").value, prompt: $("#prompt").value.trim(),
                repo: $("#repoSel").value || undefined,
                llm: $("#llmSel").value || undefined,
                model: $("#modelSel").value || undefined};
  if (!body.prompt) return toast("write the task first");
  $("#dlg").close(); toast("dispatching…");
  const r = await fetch("/api/dispatch", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
    .then(r=>r.json());
  toast(r.out || (r.ok ? "dispatched" : "failed")); refresh();
};
refresh();
// SSE keeps the board fresh; the interval is only a reconnect fallback.
try {
  const es = new EventSource("/api/events");
  es.onmessage = () => refresh();
  setInterval(refresh, 60000);
} catch (e) {
  setInterval(refresh, 5000);
}
</script>
</body>
</html>
