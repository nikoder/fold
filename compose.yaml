# fold board — run from a checkout of this repo:
#   docker compose up -d --build
#
# Host networking: humans enter through the reverse-proxy front door
# (basic auth); the raw port is deny-by-default for everything else. Mutations go through foldctl, which needs
# the incus socket.
services:
  board:
    build: ./board
    container_name: fold-board
    restart: unless-stopped
    network_mode: host
    environment:
      # 0.0.0.0: loopback keeps the human plane; anything else (shepherd
      # sessions on the incus bridge) needs the agent-plane bearer token
      # and gets dispatch + messaging only.
      FOLD_BOARD_BIND: ${FOLD_BOARD_BIND:-0.0.0.0}
      FOLD_CREDS: /creds/bellwether.env
      FOLD_STATE_DIR: /state
      FOLD_MAX_WORKING: ${FOLD_MAX_WORKING:-6}
    volumes:
      - ./:/app:ro
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - ${FOLD_CREDS_DIR:-~/coder-eval}:/creds:ro
      # One state store shared with host-side foldctl (registry, hands,
      # tokens, ctx, memstats) — a named volume would split them.
      - ${FOLD_STATE_DIR_HOST:-~/.local/state/fold}:/state
